<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Argus settings</title>
    <style>
      :root { color-scheme: light dark; font: 14px/1.5 system-ui, sans-serif; }
      body { max-width: 34rem; margin: 2rem auto; padding: 0 1rem; }
      label { display: block; margin: 1rem 0 0.25rem; font-weight: 600; }
      input[type="text"], input[type="password"], input[type="url"] { width: 100%; box-sizing: border-box; padding: 0.5rem; font: inherit; }
      .hint { font-size: 12px; opacity: 0.75; margin: 0.25rem 0 0; }
      .check { display: flex; gap: 0.5rem; align-items: center; font-weight: normal; }
      button { margin-top: 1.5rem; padding: 0.5rem 1.25rem; font: inherit; cursor: pointer; }
      #status { margin-top: 1rem; min-height: 1.5em; }
      .ok { color: #188038; } .err { color: #d93025; }
    </style>
  </head>
  <body>
    <h1>Argus settings</h1>
    <form id="form">
      <label for="origin">Worker URL</label>
      <input id="origin" type="url" placeholder="https://email-tracker.you.workers.dev" required />
      <p class="hint">Printed by <code>npx wrangler deploy</code>. Chrome will ask to let the extension reach it.</p>

      <label for="token">API token</label>
      <input id="token" type="password" autocomplete="off" required />
      <p class="hint">The value you gave <code>npx wrangler secret put API_TOKEN</code>. Stored only in this browser.</p>

      <label for="appId">InboxSDK app ID</label>
      <input id="appId" type="text" placeholder="sdk_…" required />
      <p class="hint">Free from <a href="https://register.inboxsdk.com" target="_blank" rel="noreferrer">register.inboxsdk.com</a>.</p>

      <label class="check"><input id="trackByDefault" type="checkbox" /> Track new emails by default</label>

      <button type="submit">Save</button>
    </form>
    <p id="status" role="status"></p>
    <script type="module" src="options.js"></script>
  </body>
</html>
